name: sbpf

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta, nightly]
    env:
      LLVM_PROFILE_FILE: ${{ github.workspace }}/target/profraw/%p-%m.profraw
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust (rustup)
      run: |
        rustup update ${{ matrix.rust }} --no-self-update
        rustup default ${{ matrix.rust }}
        rustup component add clippy
        rustup component add rustfmt
        rustup component add llvm-tools
      shell: bash
    - name: Install grcov
      uses: taiki-e/install-action@v2
      with:
        tool: grcov
    - name: Lint
      run: |
        cargo fmt --all -- --check
        cargo clippy --all --tests -- --deny=warnings
      if: matrix.rust == 'beta'
      shell: bash
    - name: Build and test
      run: |
        export RUSTFLAGS="-D warnings -Cinstrument-coverage"
        cargo build --verbose
        cargo build --features="shuttle-test"
        cargo test --verbose
        cargo test --test exercise_instructions --verbose
      shell: bash
    - name: Collect test coverage
      run: |
        grcov target/profraw \
          --source-dir . \
          --binary-path target/debug \
          --output-types lcov \
          --output-path lcov.info \
          --branch \
          --ignore-not-existing \
          --keep-only 'src/*'
        test -s lcov.info
      shell: bash
    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.os }}-${{ matrix.rust }}
        path: lcov.info
        if-no-files-found: error
    - name: CLI - Lint
      run: |
        cargo fmt --all --manifest-path cli/Cargo.toml -- --check
        cargo clippy --all --tests --manifest-path cli/Cargo.toml -- --deny=warnings
      if: matrix.rust == 'beta'
      shell: bash
    - name: CLI - Build and test
      run: |
        export RUSTFLAGS="-D warnings"
        cargo build --manifest-path cli/Cargo.toml --verbose
        cargo test --manifest-path cli/Cargo.toml --verbose
      shell: bash
    - name: Check fuzz
      run: |
        export RUSTFLAGS="-D warnings"
        cargo install cargo-fuzz
        cargo fuzz build
      if: matrix.rust == 'nightly' && matrix.os != 'windows-latest'
      shell: bash
    - name: Benchmark
      run: RUSTFLAGS="-D warnings" cargo bench -- --nocapture
      if: matrix.rust == 'nightly' && matrix.os != 'windows-latest'
      shell: bash

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install grcov
      uses: taiki-e/install-action@v2
      with:
        tool: grcov
    - name: Download test coverage
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        path: coverage
    - name: Merge test coverage
      run: |
        grcov coverage \
          --source-dir . \
          --output-types lcov \
          --output-path coverage.info
        test -s coverage.info
      shell: bash
    - name: Upload test coverage
      uses: codecov/codecov-action@v5
      with:
        files: coverage.info
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
    - uses: actions/checkout@v1
    - name: Doc and package
      run: |
        cargo doc
        cargo package
      shell: bash
    - name: Publish
      env:
        CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      run: cargo publish --token "$CRATES_IO_TOKEN"
