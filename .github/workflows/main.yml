name: sbpf

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, beta, nightly]
    steps:
    - uses: actions/checkout@v1
    - name: Setup Rust (rustup)
      run: |
        rustup update ${{ matrix.rust }} --no-self-update
        rustup default ${{ matrix.rust }}
        rustup component add clippy
        rustup component add rustfmt
      shell: bash
    - name: Lint
      run: |
        cargo fmt --all -- --check
        cargo clippy --all --tests -- --deny=warnings
      if: matrix.rust == 'beta'
      shell: bash
    - name: Build and test
      run: |
        export RUSTFLAGS="-D warnings"
        cargo build --verbose
        cargo build --features="shuttle-test"
        cargo test --verbose
        cargo test --test exercise_instructions --verbose
      shell: bash
    - name: CLI - Lint
      run: |
        cargo fmt --all --manifest-path cli/Cargo.toml -- --check
        cargo clippy --all --tests --manifest-path cli/Cargo.toml -- --deny=warnings
      if: matrix.rust == 'beta'
      shell: bash
    - name: CLI - Build and test
      run: |
        export RUSTFLAGS="-D warnings"
        cargo build --manifest-path cli/Cargo.toml --verbose
        cargo test --manifest-path cli/Cargo.toml --verbose
      shell: bash
    - name: Check fuzz
      run: |
        export RUSTFLAGS="-D warnings"
        cargo install cargo-fuzz
        cargo fuzz build
      if: matrix.rust == 'nightly' && matrix.os != 'windows-latest'
      shell: bash
    - name: Benchmark
      run: RUSTFLAGS="-D warnings" cargo bench -- --nocapture
      if: matrix.rust == 'nightly' && matrix.os != 'windows-latest'
      shell: bash

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust (rustup)
      run: |
        rustup update nightly --no-self-update
        rustup default nightly
        rustup component add llvm-tools
      shell: bash
    - name: Install grcov
      uses: taiki-e/install-action@v2
      with:
        tool: grcov
    - name: Run instrumented tests
      env:
        CARGO_INCREMENTAL: 0
        RUSTFLAGS: -Cinstrument-coverage
        RUSTDOCFLAGS: -Cinstrument-coverage
        LLVM_PROFILE_FILE: ${{ github.workspace }}/target/coverage/profraw/%p-%m.profraw
        CARGO_TARGET_DIR: ${{ github.workspace }}/target/coverage
      run: cargo test --verbose
      shell: bash
    - name: Generate test coverage
      run: |
        grcov target/coverage/profraw \
          --source-dir . \
          --binary-path target/coverage/debug \
          --output-types lcov \
          --output-path coverage.info \
          --branch \
          --ignore-not-existing \
          --ignore '/*' \
          --ignore 'target/*' \
          --keep-only 'src/*'
        test -s coverage.info
      shell: bash
    - name: Upload test coverage
      uses: codecov/codecov-action@v5
      with:
        files: coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
    - uses: actions/checkout@v1
    - name: Doc and package
      run: |
        cargo doc
        cargo package
      shell: bash
    - name: Publish
      env:
        CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      run: cargo publish --token "$CRATES_IO_TOKEN"
